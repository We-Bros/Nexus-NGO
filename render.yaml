services:
  # Option 1: Static Site (Fastest, 100% Free on Render)
  - type: web
    name: nexus-human-rights-council
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

