services:
  - type: web
    name: nexus-human-rights-council
    env: node
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: BREVO_SMTP_LOGIN
        sync: false
      - key: BREVO_SMTP_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: RECEIVER_EMAIL
        sync: false

