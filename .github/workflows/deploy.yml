name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Prepare deployment bundle
        run: |
          mkdir -p deploy_pkg
          cp -r dist deploy_pkg/
          cp server.js package.json package-lock.json deploy_pkg/
          cat << EOF > deploy_pkg/.env
          PORT=${{ secrets.PORT || '3000' }}
          BREVO_SMTP_LOGIN=${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY=${{ secrets.BREVO_SMTP_KEY }}
          SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL=${{ secrets.RECEIVER_EMAIL }}
          EOF

      - name: Deploy to EC2
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          REMOTE_USER: ${{ secrets.EC2_USER }}
          SOURCE: "deploy_pkg/"
          TARGET: "/home/${{ secrets.EC2_USER }}/ngo-site"
          EXCLUDE: ""
          SCRIPT_AFTER: |
            cd /home/${{ secrets.EC2_USER }}/ngo-site
            npm ci --omit=dev
            pm2 delete ngo-site 2>/dev/null || true
            pm2 start server.js --name ngo-site
            pm2 save
